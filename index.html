<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentkursus</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/css/kursus.css">
</head>
<body>
  <main>
    <p class="pladsholder">Indlæser kursus ...</p>
  </main>
  <footer><span class="verificeret">Sidst verificeret: ...</span></footer>
  <script src="assets/js/fremdrift.js"></script>
  <script>
  (function () {
    "use strict";
    function el(tag, attrs, born) {
      var e = document.createElement(tag);
      if (attrs) Object.keys(attrs).forEach(function (k) {
        if (k === "text") e.textContent = attrs[k];
        else if (k === "class") e.className = attrs[k];
        else e.setAttribute(k, attrs[k]);
      });
      (born || []).forEach(function (b) { if (b) e.appendChild(b); });
      return e;
    }
    function render(k) {
      var main = document.querySelector("main");
      main.textContent = "";
      main.appendChild(el("h1", { text: k.titel }));
      main.appendChild(el("p", { class: "meta", text: k.undertitel }));

      var total = k.moduler.reduce(function (s, m) { return s + m.tidsestimat; }, 0);
      main.appendChild(el("p", { class: "brod", text: "14 moduler, cirka " + Math.round(total / 60 * 10) / 10 + " timers ren modultid. " + k.dage.map(function (d) { return d.titel + ": modul " + d.moduler[0] + " til " + d.moduler[d.moduler.length - 1] + ", cirka " + d.effektiveTimer + " effektive timer."; }).join(" ") }));
      main.appendChild(el("p", { class: "note", text: k.dagNote }));

      main.appendChild(el("p", { class: "kun-skaerm" }, [el("a", { href: "preflight.html", text: "Pre-flight: kør tjeklisten dagen før" })]));

      var fremdrift = window.Fremdrift ? window.Fremdrift.laes() : { moduler: {} };
      k.dele.forEach(function (d) {
        var sek = el("section", { class: "del" }, [el("h2", { text: "Del " + d.nr + ": " + d.titel + " (dag " + d.dag + ")" })]);
        var ul = el("ul", { class: "modulliste" });
        k.moduler.filter(function (m) { return m.del === d.nr; }).forEach(function (m) {
          var f = fremdrift.moduler[m.id];
          var titelEl = m.status === "planlagt"
            ? el("span", { class: "planlagt", text: m.titel + " (kommer)" })
            : el("a", { href: "moduler/" + m.slug + "/", text: m.titel });
          ul.appendChild(el("li", null, [
            el("span", { class: "id", text: m.id }),
            titelEl,
            el("span", { class: "tid", text: (f && f.gennemfoert ? "gennemført, " : "") + m.tidsestimat + " min" })
          ]));
        });
        sek.appendChild(ul);
        main.appendChild(sek);
      });

      main.appendChild(el("section", { id: "fremdrift" }, [
        el("h2", { text: "Fremdrift" }),
        el("p", { class: "pladsholder", text: "Fremdriftsviser med eksport og import kommer i Fase 8. Data gemmes kun i din browser under nøglen " + k.fremdriftNoegle + "." })
      ]));

      var fod = document.querySelector("footer .verificeret");
      if (fod) fod.textContent = "Sidst verificeret: " + k.sidstVerificeret + ". Version " + k.version + ".";
    }
    fetch("indhold/kursus.json")
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(render)
      .catch(function (e) {
        var main = document.querySelector("main");
        main.textContent = "";
        main.appendChild(el("h1", { text: "Kurset kunne ikke indlæses" }));
        main.appendChild(el("p", { class: "brod", text: "Kunne ikke hente indhold/kursus.json (" + e.message + "). Kører du lokalt, så start en server med: python3 -m http.server" }));
      });
  })();
  </script>
</body>
</html>
