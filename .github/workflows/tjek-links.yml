# Tjekker alle links i kursets indhold ved hvert push og hver mandag.
# Baseret paa lycheeverse/lychee-action README, verificeret 2026-09-06.
name: Tjek links

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,206,429 --exclude 'localhost' --exclude 'ond\.example' --exclude 'dash\.cloudflare\.com' --exclude 'agentkursus\.pages\.dev' 'indhold/**/*.json' 'README.md' 'worker/README.md' 'index.html' 'preflight.html' 'dashboard.html'
          fail: true
